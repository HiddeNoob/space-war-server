version: '3.8'

services:
  space-war-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: space-war-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MAVEN_CONFIG=/home/server/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
